android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# --- Gateway app customisation -------------------------------------------
# The Zender this app talks to. REQUIRED when building from source -- the build
# fails without it -- because a source build is made for one specific install and
# should not ask its users to type an address. Leave empty only for the prebuilt
# APK, which takes its address from the pairing QR.
# Example: defaultSiteUrl=https://sms.example.com/
defaultSiteUrl=

# The neutral build that ships with Zender. Leave false when building from
# source; set it only for that shipped APK, via -Pprebuilt=true.
#
# It governs two things, because both follow from "this app belongs to nobody in
# particular": pairing is scan-only (there is no site to sign in to until a QR
# names one), and the placeholder logo is hidden (shipping someone else's
# branding, or a "BRAND" placeholder, would be worse than shipping none).
prebuilt=false
